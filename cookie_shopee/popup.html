<!DOCTYPE html>
<html>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopee Cookie Getter - Multi Country</title>
  <style>
    body {
      width: 450px;
      padding: 14px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ee4d2d 0%, #d73211 100%);
      color: white;
      box-sizing: border-box;
    }
    
    .header {
      text-align: center;
      margin-bottom: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    
    .header h2 {
      margin: 0;
      font-size: 17px;
    }
    
    .header .subtitle {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 4px;
    }
    
    .country-info {
      background: rgba(255, 255, 255, 0.15);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      text-align: center;
      font-size: 13px;
    }
    
    .country-flag {
      font-size: 18px;
      margin-right: 6px;
    }
    
    .container {
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.12);
      padding: 10px 12px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
    }
    
    .container h3 {
      margin: 0 0 6px 0;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    
    textarea {
      width: 100%;
      height: 85px;
      margin-top: 4px;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.96);
      color: #222;
      resize: vertical;
      box-sizing: border-box;
    }
    
    button {
      margin-top: 8px;
      padding: 7px 14px;
      background: rgba(255, 255, 255, 0.22);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    
    button:hover {
      background: rgba(255, 255, 255, 0.32);
      transform: translateY(-1px);
    }

    .btn-mls {
      background: #198754;
      border-color: #20c997;
      width: 100%;
      padding: 9px 14px;
      font-size: 13px;
    }

    .btn-mls:hover {
      background: #157347;
    }

    select {
      width: 100%;
      padding: 7px 8px;
      border-radius: 4px;
      border: none;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.96);
      color: #222;
      margin-top: 4px;
      box-sizing: border-box;
    }
    
    .status {
      font-size: 11px;
      opacity: 0.95;
      font-weight: 600;
    }
    
    .error {
      color: #ffe066;
    }
    
    .success {
      color: #90EE90;
    }
    
    .last-updated {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 5px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🛒 Shopee Cookie (TIGER 10)</h2>
    <div class="subtitle">OSCAL TIGER 10 • Android 13 (SDK 33) • Shopee v3.64.48 (36448)</div>
  </div>

  <div class="country-info" id="countryInfo">
    <span id="countryFlag">🌏</span>
    <span id="countryName">Chọn trang Shopee để lấy cookie</span>
  </div>

  <div class="container" style="text-align:center; padding:8px;">
    <button id="powerToggle" style="margin-top:0; min-width:180px;">...</button>
  </div>

  <div class="container">
    <h3>
      <span>🍪 Cookie:</span>
      <span class="status" id="cookieStatus">Đang lấy cookie...</span>
    </h3>
    <textarea id="cookieOutput" readonly placeholder="Cookie sẽ xuất hiện tại đây..."></textarea>
    <div class="btn-row">
      <button id="copyCookie" style="flex:1;">📋 Copy Cookie</button>
    </div>
    <div class="last-updated" id="cookieLastUpdated"></div>
  </div>

  <div class="container">
    <h3>
      <span>⚡ Đồng Bộ Tool MLS (127.0.0.1:6868):</span>
      <span class="status" id="mlsSyncStatus">⏸️ Thủ công</span>
    </h3>
    <select id="mlsThreadSelect">
      <option value="">-- Tự động khớp theo SPC_U / Tên Profile GemLogin --</option>
    </select>
    <button id="pushToMlsBtn" class="btn-mls">🚀 Đẩy vào Tool MLS & Chạy lại Luồng</button>
  </div>

  <script src="inject.js"></script>
  <script src="popup.js"></script>
</body>
</html>
